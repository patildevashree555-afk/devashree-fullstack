<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            🎓 Student Result Portal
        </div>

        <nav>
            <a href="#registration">Registration</a>
            <a href="#result">Result</a>
        </nav>
    </header>


    <!-- MAIN -->
    <main class="container">

        <!-- REGISTRATION CARD -->
        <section class="registration-box" id="registration">

            <div class="heading-area">
                <span class="small-title">ACADEMIC MANAGEMENT</span>

                <h1>Student Registration</h1>

                <p>
                    Enter student details and marks to generate the result.
                </p>
            </div>


            <!-- STUDENT DETAILS -->
            <div class="section-title">
                <span>01</span>
                Student Information
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="studentName">Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name">
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email">
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter 10 digit number">
                </div>


                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="BSc IT">
                            BSc IT
                        </option>

                    </select>
                </div>

            </div>


            <!-- SUBJECTS -->
            <div class="section-title">
                <span>02</span>
                Subject Marks
            </div>


            <div class="form-grid">

                <!-- HTML -->
                <div class="form-group">

                    <label for="htmlMarks">
                        HTML
                    </label>

                    <input
                        type="number"
                        id="htmlMarks"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100">

                </div>


                <!-- CSS -->
                <div class="form-group">

                    <label for="cssMarks">
                        CSS
                    </label>

                    <input
                        type="number"
                        id="cssMarks"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100">

                </div>


                <!-- JAVASCRIPT -->
                <div class="form-group">

                    <label for="jsMarks">
                        JavaScript
                    </label>

                    <input
                        type="number"
                        id="jsMarks"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100">

                </div>


                <!-- PYTHON -->
                <div class="form-group">

                    <label for="pythonMarks">
                        Python
                    </label>

                    <input
                        type="number"
                        id="pythonMarks"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100">

                </div>

            </div>


            <!-- EXTRA SUBJECTS -->
            <div id="extraSubjects"></div>


            <!-- BUTTONS -->
            <div class="button-group">

                <button
                    class="generate-btn"
                    onclick="generateResult()">

                    Generate Result
                </button>


                <button
                    class="add-btn"
                    onclick="addSubject()">

                    + Add Subject
                </button>


                <button
                    class="clear-btn"
                    onclick="clearForm()">

                    Clear
                </button>

            </div>

        </section>


        <!-- RESULT CARD -->
        <section class="result-box" id="result">

            <div class="result-heading">

                <span class="small-title">
                    PERFORMANCE REPORT
                </span>

                <h2>Student Result</h2>

                <p id="resultMessage">
                    Your result will appear here after generating.
                </p>

            </div>


            <!-- RESULT CONTENT -->
            <div id="resultContent"></div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        © 2026 Student Result Portal
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
